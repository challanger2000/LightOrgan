name: Build Windows VST3

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DSMTG_CREATE_PLUGIN_LINK=0 -DSMTG_CREATE_BUNDLE_FOR_WINDOWS=1

      - name: Build LightOrgan
        shell: pwsh
        run: cmake --build build --config Release --target LightOrgan --parallel

      - name: Locate and verify LightOrgan VST3 bundle
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE\build"
          $artifact = "$env:GITHUB_WORKSPACE\artifact"
          New-Item -ItemType Directory -Force -Path $artifact | Out-Null
          $bundles = Get-ChildItem $root -Recurse -Directory -Filter "LightOrgan.vst3" -ErrorAction SilentlyContinue
          $p = $bundles | Where-Object { Test-Path (Join-Path $_.FullName "Contents") } | Select-Object -First 1
          if (-not $p) { throw "LightOrgan.vst3 bundle not found" }
          $resources = Join-Path $p.FullName "Contents\Resources"
          foreach ($name in @(
            "LightOrgan.uidesc",
            "LightOrgan_MainGUI.png",
            "knob_vintage.png",
            "lamp_bass_RUHE.png",
            "lamp_bass_MODERAT.png",
            "lamp_bass_STARK.png",
            "lamp_bass_PEAK.png",
            "lamp_low_RUHE.png",
            "lamp_low_MODERAT.png",
            "lamp_low_STARK.png",
            "lamp_low_PEAK.png",
            "lamp_low_mid_RUHE.png",
            "lamp_low_mid_MODERAT.png",
            "lamp_low_mid_STARK.png",
            "lamp_low_mid_PEAK.png",
            "lamp_mid_RUHE.png",
            "lamp_mid_MODERAT.png",
            "lamp_mid_STARK.png",
            "lamp_mid_PEAK.png",
            "lamp_high_mid_RUHE.png",
            "lamp_high_mid_MODERAT.png",
            "lamp_high_mid_STARK.png",
            "lamp_high_mid_PEAK.png",
            "lamp_high_RUHE.png",
            "lamp_high_MODERAT.png",
            "lamp_high_STARK.png",
            "lamp_high_PEAK.png",
            "lamp_strobe_RUHE.png",
            "lamp_strobe_MODERAT.png",
            "lamp_strobe_STARK.png",
            "lamp_strobe_PEAK.png"
          )) {
            if (-not (Test-Path (Join-Path $resources $name))) {
              throw "Missing GUI resource in VST3 bundle: $name"
            }
          }
          Copy-Item $p.FullName "$artifact\LightOrgan.vst3" -Recurse -Force

      - name: Upload LightOrgan VST3 bundle
        uses: actions/upload-artifact@v5
        with:
          name: LightOrgan-Windows-VST3
          path: artifact
          if-no-files-found: error
