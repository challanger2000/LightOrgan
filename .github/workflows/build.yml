name: Build Windows VST3

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare exact runtime GUI assets
        shell: pwsh
        run: |
          python -m pip install pillow
          @'
          from PIL import Image
          from pathlib import Path
          r = Path('resource')
          for p in r.glob('lamp_*.png'):
              im = Image.open(p).convert('RGBA')
              if im.size == (426, 426):
                  im.resize((192, 192), Image.Resampling.LANCZOS).save(p)
          p = r / 'knob_vintage.png'
          im = Image.open(p).convert('RGBA')
          crop = im.crop((176, 165, 1077, 1066))
          crop.resize((130, 130), Image.Resampling.LANCZOS).save(r / 'knob_runtime.png')
          # MODE assets are production geometry, not scalable artwork.
          for name in ('ORGAN_OFF.png','ORGAN_ON.png','BOTH_OFF.png','BOTH_ON.png','STROBE_OFF.png','STROBE_ON.png'):
              im = Image.open(r / name).convert('RGBA')
              if im.size != (118, 96):
                  raise RuntimeError(f'{name}: expected 118x96, got {im.size}')
          '@ | python

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DSMTG_CREATE_PLUGIN_LINK=0 -DSMTG_CREATE_BUNDLE_FOR_WINDOWS=1

      - name: Build LightOrgan
        shell: pwsh
        run: cmake --build build --config Release --target LightOrgan --parallel

      - name: Locate and verify LightOrgan VST3 bundle
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE\build"
          $artifact = "$env:GITHUB_WORKSPACE\artifact"
          New-Item -ItemType Directory -Force -Path $artifact | Out-Null
          $bundles = Get-ChildItem $root -Recurse -Directory -Filter "LightOrgan.vst3" -ErrorAction SilentlyContinue
          $p = $bundles | Where-Object { Test-Path (Join-Path $_.FullName "Contents") } | Select-Object -First 1
          if (-not $p) { throw "LightOrgan.vst3 bundle not found" }
          $resources = Join-Path $p.FullName "Contents\Resources"
          foreach ($name in @(
            "LightOrgan.uidesc", "LightOrgan_MainGUI.png", "knob_runtime.png",
            "ORGAN_OFF.png", "ORGAN_ON.png", "BOTH_OFF.png", "BOTH_ON.png", "STROBE_OFF.png", "STROBE_ON.png",
            "lamp_bass_RUHE.png", "lamp_bass_MODERAT.png", "lamp_bass_STARK.png", "lamp_bass_PEAK.png",
            "lamp_low_RUHE.png", "lamp_low_MODERAT.png", "lamp_low_STARK.png", "lamp_low_PEAK.png",
            "lamp_low_mid_RUHE.png", "lamp_low_mid_MODERAT.png", "lamp_low_mid_STARK.png", "lamp_low_mid_PEAK.png",
            "lamp_mid_RUHE.png", "lamp_mid_MODERAT.png", "lamp_mid_STARK.png", "lamp_mid_PEAK.png",
            "lamp_high_mid_RUHE.png", "lamp_high_mid_MODERAT.png", "lamp_high_mid_STARK.png", "lamp_high_mid_PEAK.png",
            "lamp_high_RUHE.png", "lamp_high_MODERAT.png", "lamp_high_STARK.png", "lamp_high_PEAK.png",
            "lamp_strobe_RUHE.png", "lamp_strobe_MODERAT.png", "lamp_strobe_STARK.png", "lamp_strobe_PEAK.png"
          )) {
            if (-not (Test-Path (Join-Path $resources $name))) { throw "Missing GUI resource in VST3 bundle: $name" }
          }
          Copy-Item $p.FullName "$artifact\LightOrgan.vst3" -Recurse -Force

      - name: Upload LightOrgan VST3 bundle
        uses: actions/upload-artifact@v5
        with:
          name: LightOrgan-Windows-VST3
          path: artifact
          if-no-files-found: error
# MODE bitmap integration build
